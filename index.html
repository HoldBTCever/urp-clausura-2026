<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo Clausura 2026 — Primera División URP</title>
<meta name="description" content="Seguí la clasificación del Torneo Clausura 2026 de la Primera División de rugby de Paraguay (URP): tabla, última fecha, Copa Oro, Copa Desarrollo, semifinales y final.">
<link rel="icon" href="assets/logos/urp-shield.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <img src="assets/logos/urp-shield.png" alt="URP" class="urp-shield">
    <div class="header-text">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1><span data-i18n="title_line1"></span><br><span class="sub-title" data-i18n="title_line2"></span></h1>
    </div>
    <div class="header-controls">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="pt">PT</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button id="theme-toggle" class="theme-toggle" aria-label="Modo oscuro" title="Modo oscuro">🌙</button>
    </div>
  </div>
</header>

<main>

  <section id="tabela-section" class="card">
    <h2 data-i18n="standings_title"></h2>
    <p class="hint" id="tabela-hint"></p>
    <div class="table-scroll">
      <table id="tabela-principal" class="standings"></table>
    </div>
  </section>

  <section id="ultima-rodada" class="card sim-card">
    <h2><span data-i18n="last_round_title"></span> <span class="badge-sim" data-i18n="sim_badge"></span></h2>
    <p class="hint" data-i18n="last_round_desc"></p>
    <div id="round7-matches" class="matches-grid"></div>
  </section>

  <section class="card">
    <h2 data-i18n="final_phase_title"></h2>
    <p class="hint" data-i18n="final_phase_desc"></p>
  </section>

  <section id="fase-final" class="phase-columns">
    <div class="phase-col oro">
      <h2>🏆 <span data-i18n="cup_oro_title"></span> <span class="sub" data-i18n="cup_oro_sub"></span></h2>
      <div id="oro-groupstage"></div>
      <h3><span data-i18n="semifinal"></span> <span class="date">24/10</span></h3>
      <div id="oro-semis" class="matches-grid"></div>
      <h3><span data-i18n="final"></span> <span class="date">31/10</span></h3>
      <div id="oro-final" class="matches-grid"></div>
      <div id="oro-champion" class="champion-banner" hidden></div>
    </div>
    <div class="phase-col desarrollo">
      <h2>🥈 <span data-i18n="cup_des_title"></span> <span class="sub" data-i18n="cup_des_sub"></span></h2>
      <div id="des-groupstage"></div>
      <h3><span data-i18n="semifinal"></span> <span class="date">24/10</span></h3>
      <div id="des-semis" class="matches-grid"></div>
      <h3><span data-i18n="final"></span> <span class="date">31/10</span></h3>
      <div id="des-final" class="matches-grid"></div>
      <div id="des-champion" class="champion-banner" hidden></div>
    </div>
  </section>

  <section class="card">
    <button id="reset-sim" class="btn-reset" data-i18n="reset_btn"></button>
    <p class="footnote" data-i18n="footnote"></p>
  </section>

</main>

<footer class="site-footer">
  <p data-i18n="footer"></p>
</footer>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
